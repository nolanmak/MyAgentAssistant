[package]
name = "augmentagent-channel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
augmentagent-store = { path = "../augmentagent-store" }
augmentagent-wiki = { path = "../augmentagent-wiki" }
# #58 engagement engine surfaces preview / failure cards through the shared
# ApprovalBroker trait. approval-discord depends only on -store, so this
# does not create a dependency cycle.
augmentagent-approval-discord = { path = "../augmentagent-approval-discord" }
# #128 — load provider API keys from the OS keyring just-in-time at the
# wiki-query call boundary so secrets don't sit on disk in `.env`.
augmentagent-auth = { path = "../augmentagent-auth" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# RateGovernor (#83) — uuid for permit ids, chrono for quiet-hours TZ math.
uuid = { workspace = true }
chrono = { workspace = true }
# #655/#656 — parse the quota refusal's "resets 9:30am (America/New_York)"
# hint into a UTC instant for the fallback chain's cooldown latch.
chrono-tz = { workspace = true }
# #655 — provider adapters (codex/gemini) pass system prompts and per-spawn
# settings via temp files (neither CLI takes them as an argument string).
tempfile = "3"
# #35 Phase 2 — Composio-backed free/busy + Drive search resolver clients.
# Self-contained reqwest client (intentional duplication, see resolve.rs).
reqwest = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# #954 — the CLI-gate wait/hold deadlines are minutes-to-hours long; the
# tests drive them with tokio's paused clock instead of sleeping for real.
tokio = { workspace = true, features = ["test-util"] }
# #501 — timeparse DST fixture tests pin America/New_York (chrono::Local
# reads TZ once at process start, so env-pinning in tests is unreliable).
chrono-tz = { workspace = true }
# Tests pre-create the Node-tree-owned tables before opening Store, so the
# additive migrations don't trip on missing parent tables.
rusqlite = { workspace = true }
